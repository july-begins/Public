<div class="sync-status" id="syncStatus">☁️ 未配置云同步</div>
<input type="file" id="importFileInput" accept=".json" style="display:none;">

<div class="timeline-bar">

    <span class="stage-dot active" data-days="3">产后3天</span>
    <span class="stage-dot" data-days="15">产后15天</span>
    <span class="stage-dot" data-days="30">满月</span>
  </div>
</div>

<div class="alert-panel" id="alertPanel"><div class="alert-icon">🔔</div><div class="alert-text" id="alertText">加载中...</div></div>

<div class="progress-panel">

  <div class="progress-stats" id="progressText">0%</div>
</div>

<div class="view-row">

</div>

<button class="btn btn-outline" id="openLibraryBtn">📚 物品库添加</button>

<div class="item-list" id="itemList"></div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">

    <input type="text" id="repoUrl" value="https://github.com/july-begins/baby-checklist">
    <label>个人访问令牌 (Token，需 repo 权限)</label>

      <button class="status-btn" id="syncCloseBtn">关闭</button>
    </div>
  </div>
</div>

    <label>结束天数</label><input type="number" id="mEnd" value="30">
    <label>描述</label><input type="text" id="mDesc">
    <label>是什么</label><textarea id="mWhat" rows="2"></textarea>
    <label>为什么</label><textarea id="mWhy" rows="2"></textarea>
    <label>怎么使用</label><textarea id="mHow" rows="2"></textarea>
    <label>好处</label><input type="text" id="mBenefit">
    <label>备用/规格</label><input type="text" id="mAlt">
    <div class="btn-row">

  </div>
</div>

    { id:203, name:"听力筛查", role:"宝宝", cat:"疫苗/检查", emoji:"\u{1F442}", qty:0, s:2, e:3, desc:"无创测试", what:"听力测试", why:"早发现耳聋", how:"睡眠中测", benefit:"避免聋哑", alt:"" },
    { id:204, name:"乙肝疫苗②", role:"宝宝", cat:"疫苗/检查", emoji:"\u{1F489}", qty:0, s:30, e:30, desc:"满月接种", what:"第二针", why:"完成基础免疫", how:"社区接种", benefit:"保护力提升", alt:"" },
    { id:205, name:"满月体检", role:"宝宝", cat:"疫苗/检查", emoji:"\u{1F4CB}", qty:0, s:28, e:32, desc:"评估发育", what:"体格检查", why:"早发现偏离", how:"社区/儿科", benefit:"健康监测", alt:"" }
  ];

  const STORAGE_CUSTOM = 'bb_custom_v10';
  const STORAGE_STATES = 'bb_states_v10';
  const STORAGE_DAY = 'bb_day_v10';
  const GIT_CONFIG_KEY = 'gh_config_v10';
  const AUTO_SYNC_KEY = 'autoSync_v10';

  let customItems = JSON.parse(localStorage.getItem(STORAGE_CUSTOM) || '[]');
  let itemStates = JSON.parse(localStorage.getItem(STORAGE_STATES) || '{}');
  let currentDay = parseInt(localStorage.getItem(STORAGE_DAY)) || 0;
  let ghConfig = JSON.parse(localStorage.getItem(GIT_CONFIG_KEY) || 'null');
  let autoSyncEnabled = localStorage.getItem(AUTO_SYNC_KEY) !== 'false';

  function saveLocal() {
    localStorage.setItem(STORAGE_CUSTOM, JSON.stringify(customItems));
    localStorage.setItem(STORAGE_STATES, JSON.stringify(itemStates));
    localStorage.setItem(STORAGE_DAY, currentDay);
  }

  function getState(id) {
    const def = [...masterLibrary, ...customItems].find(i => i.id == id);
    const stored = itemStates[id] || {};
    return {
      status: stored.status || 'none',
      qty: stored.qty !== undefined ? stored.qty : (def ? def.qty || 0 : 0),
      used: stored.used || 0,
      brand: stored.brand || '',
      price: stored.price || '',
      alt: stored.alt !== undefined ? stored.alt : (def ? def.alt || '' : '')
    };
  }

  function setState(id, updates) {
    const current = getState(id);
    itemStates[id] = { ...current, ...updates };
    // 对于实体物品，当标记为“不需”时，只保留状态为 skip，不删除记录（以便物品库正确识别）
    // 对于护理事项/疫苗，跳过也是类似处理
    saveLocal();
    // 如果物品库弹窗当前打开，实时刷新
    if (document.getElementById('libraryModal').style.display === 'flex') {
      renderLibrary();
    }
    if (ghConfig && autoSyncEnabled) scheduleAutoSync();
  }

  function allItems() {
    const skipIds = new Set();
    for (const [id, state] of Object.entries(itemStates)) {
      if (state.status === 'skip') skipIds.add(id);
    }
    const activeMaster = masterLibrary.filter(i => !skipIds.has(String(i.id)));
    const activeCustom = customItems.filter(i => !skipIds.has(String(i.id)));
    return [...activeMaster, ...activeCustom];
  }

  let currentView = 'active';
  let currentRole = 'all';

  function getFilteredItems() {
    let items = allItems();
    if (currentRole !== 'all') items = items.filter(i => i.role === currentRole);
    if (currentView === 'active') {
      items = items.filter(i => currentDay >= i.s && currentDay <= i.e);
      items = items.filter(i => {
        const st = getState(i.id).status;
        if (i.cat === '护理事项' || i.cat === '疫苗/检查') return st !== 'done' && st !== 'skip';
        return st === 'bought' || st === 'packed';
      });
    } else if (currentView === 'pending') {
      items = items.filter(i => currentDay >= i.s && currentDay <= i.e && getState(i.id).status === 'none');
    } else if (currentView === 'done') {
      items = items.filter(i => currentDay >= i.s && currentDay <= i.e && (i.cat === '护理事项' || i.cat === '疫苗/检查') && getState(i.id).status === 'done');
    }
    return items;
  }

  function render() {
    const items = getFilteredItems();
    const list = document.getElementById('itemList');
    list.innerHTML = '';
    if (!items.length) { list.innerHTML = '<div style="text-align:center;padding:24px;color:#b0a090;">✨ 暂无物品</div>'; return; }
    items.forEach(item => {
      const state = getState(item.id);
      const isUrgent = item.cat === '护理事项' || item.cat === '疫苗/检查';
      const remaining = Math.max(0, state.qty - state.used);
      const ready = state.status === 'bought' || state.status === 'packed';
      const card = document.createElement('div');
      card.className = `item-card${isUrgent ? ' urgent' : ''}${state.status === 'bought' ? ' bought' : ''}${state.status === 'packed' ? ' packed' : ''}`;
      card.innerHTML = `
        <div class="item-main" data-id="${item.id}">
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-info">
            <div class="item-title">${item.name} <span class="item-badge">${item.cat}</span></div>
            <div class="item-desc">${item.desc || ''}</div>
            <div class="status-actions">
              ${isUrgent ? `
                <button class="status-btn ${state.status==='none'?'active-none':''}" data-action="status" data-status="none">未完成</button>
                <button class="status-btn ${state.status==='done'?'active-done':''}" data-action="status" data-status="done">已完成</button>
                <button class="status-btn ${state.status==='skip'?'active-skip':''}" data-action="status" data-status="skip">跳过</button>
              ` : `
                <button class="status-btn ${state.status==='none'?'active-none':''}" data-action="status" data-status="none">未准备</button>
                <button class="status-btn ${state.status==='bought'?'active-bought':''}" data-action="status" data-status="bought">已购买</button>
                <button class="status-btn ${state.status==='packed'?'active-packed':''}" data-action="status" data-status="packed">已打包</button>
                <button class="status-btn ${state.status==='skip'?'active-skip':''}" data-action="status" data-status="skip">不需</button>
              `}
            </div>
          </div>
          ${item.qty > 0 ? `
          <div class="remain-badge ${remaining <= 3 ? 'low' : ''}">
            📦 ${remaining}/${state.qty}
            <button class="qty-btn" data-action="use" ${!ready?'disabled':''}>−</button>
            <button class="qty-btn" data-action="add" ${!ready?'disabled':''}>+</button>
          </div>` : ''}
        </div>
        <div class="detail-panel" id="detail-${item.id}">
          <div class="detail-grid">
            <div class="detail-item"><div class="detail-label">是什么</div>${item.what||'—'}</div>
            <div class="detail-item"><div class="detail-label">为什么</div>${item.why||'—'}</div>
            <div class="detail-item"><div class="detail-label">怎么使用</div>${item.how||'—'}</div>
            <div class="detail-item"><div class="detail-label">好处</div>${item.benefit||'—'}</div>
            <div class="detail-item" style="grid-column:span 2;"><div class="detail-label">规格/备用（可编辑）</div><input id="alt-${item.id}" value="${state.alt}"></div>
          </div>
          <div class="brand-row">
            <input placeholder="品牌" id="brand-${item.id}" value="${state.brand}">
            <input placeholder="价格" id="price-${item.id}" value="${state.price}">
            ${item.qty > 0 ? `<input placeholder="总数量" type="number" id="totalQty-${item.id}" value="${state.qty}" min="0" style="width:80px;">` : ''}
            <button class="status-btn" data-action="saveMeta" data-id="${item.id}">保存修改</button>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
    updateProgress();
    updateAlert();
  }

  function updateAlert() {
    const urgent = allItems().filter(i => (i.cat==='疫苗/检查'||i.cat==='护理事项') && currentDay>=i.s && currentDay<=i.e && getState(i.id).status!=='done' && getState(i.id).status!=='skip');
    const lowStock = allItems().filter(i => currentDay>=i.s && currentDay<=i.e && (i.cat!=='护理事项' && i.cat!=='疫苗/检查') && ['bought','packed'].includes(getState(i.id).status) && (getState(i.id).qty - getState(i.id).used) <= 3 && getState(i.id).qty > 0);
    let html = '';
    if (urgent.length) html += `<div>✅ 今日提醒：${urgent.map(i=>i.name).join('、')}</div>`;
    if (lowStock.length) html += `<div>⚠️ 物品不足：${lowStock.map(i=>`${i.name}(剩${Math.max(0,getState(i.id).qty-getState(i.id).used)}/${getState(i.id).qty})`).join('、')}</div>`;
    document.getElementById('alertText').innerHTML = html || '<div>📭 今日无特殊提醒</div>';
  }

  function updateProgress() {
    const items = getFilteredItems().filter(i => i.cat !== '护理事项' && i.cat !== '疫苗/检查');
    const total = items.length;
    const done = items.filter(i => ['bought','packed'].includes(getState(i.id).status)).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById('progressFill').style.width = pct+'%';
    document.getElementById('progressText').textContent = `${pct}% 已备 (${done}/${total})`;
  }

  // 事件委托
  document.getElementById('itemList').addEventListener('click', e => {
    const target = e.target;
    const main = target.closest('.item-main');
    if (main && !target.closest('button') && !target.closest('input')) {
      document.getElementById(`detail-${main.dataset.id}`)?.classList.toggle('open');
      return;
    }
    const btn = target.closest('button');
    if (!btn) return;
    const id = btn.closest('[data-id]')?.dataset.id;
    if (!id) return;
    if (btn.dataset.action === 'status') { setState(id, { status: btn.dataset.status }); render(); }
    else if (btn.dataset.action === 'use') { const st = getState(id); setState(id, { used: Math.min(st.qty, (st.used||0)+1) }); render(); }
    else if (btn.dataset.action === 'add') { const st = getState(id); setState(id, { used: Math.max(0, (st.used||0)-1) }); render(); }
    else if (btn.dataset.action === 'saveMeta') {
      const brand = document.getElementById(`brand-${id}`)?.value || '';
      const price = document.getElementById(`price-${id}`)?.value || '';
      const alt = document.getElementById(`alt-${id}`)?.value || '';
      const totalQtyEl = document.getElementById(`totalQty-${id}`);
      const update = { brand, price, alt };
      if (totalQtyEl) update.qty = parseInt(totalQtyEl.value) || 0;
      setState(id, update);
      render();
      showToast('已保存');
    }
  });

  // 天数与阶段
  document.getElementById('dayInput').addEventListener('change', () => { currentDay = parseInt(document.getElementById('dayInput').value) || 0; saveLocal(); updateStage(); render(); });
  document.getElementById('quickStages').addEventListener('click', e => {
    const dot = e.target.closest('.stage-dot');
    if (!dot) return;
    currentDay = parseInt(dot.dataset.days);
    document.getElementById('dayInput').value = currentDay;
    saveLocal(); updateStage(); render();
    document.querySelectorAll('.stage-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
  });

  function updateStage() {
    const label = document.getElementById('stageLabel');
    label.textContent = currentDay < 0 ? '🤰 待产期' : (currentDay <= 3 ? '🏥 住院期间' : (currentDay <= 30 ? '🏠 回家~满月' : '👶 满月后'));
  }

  // 视图与筛选
  document.querySelector('.view-row').addEventListener('click', e => {
    const btn = e.target.closest('.view-btn');
    if (!btn) return;
    currentView = btn.dataset.view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
  document.querySelector('.filter-row').addEventListener('click', e => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    currentRole = chip.dataset.role;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });

  // 手动添加弹窗
  document.getElementById('addItemBtn').addEventListener('click', () => { document.getElementById('manualModal').style.display = 'flex'; });
  document.getElementById('manualClose').addEventListener('click', () => { document.getElementById('manualModal').style.display = 'none'; });
  document.getElementById('manualSave').addEventListener('click', () => {
    const name = document.getElementById('mName').value.trim();
    if (!name) return showToast('名称必填');
    if (allItems().some(i => i.name === name)) return showToast('物品已存在');
    customItems.push({
      id: Date.now(), name,
      role: document.getElementById('mRole').value,
      cat: document.getElementById('mCat').value || '其他',
      emoji: '📦', qty: 0,
      s: parseInt(document.getElementById('mStart').value)||0,
      e: parseInt(document.getElementById('mEnd').value)||30,
      desc: document.getElementById('mDesc').value,
      what: document.getElementById('mWhat').value,
      why: document.getElementById('mWhy').value,
      how: document.getElementById('mHow').value,
      benefit: document.getElementById('mBenefit').value,
      alt: document.getElementById('mAlt').value
    });
    saveLocal();
    document.getElementById('manualModal').style.display = 'none';
    render(); updateAlert(); showToast('已添加');
  });

  // 搜索填充
  document.getElementById('searchItemBtn').addEventListener('click', () => {
    const name = document.getElementById('searchName').value.trim();
    if (!name) return showToast('请输入名称');
    const found = [...masterLibrary, ...customItems].find(i => i.name === name) || [...masterLibrary, ...customItems].find(i => i.name.includes(name));
    if (found) {
      document.getElementById('mName').value = found.name;
      document.getElementById('mRole').value = found.role;
      document.getElementById('mCat').value = found.cat || '';
      document.getElementById('mStart').value = found.s || 0;
      document.getElementById('mEnd').value = found.e || 30;
      document.getElementById('mDesc').value = found.desc || '';
      document.getElementById('mWhat').value = found.what || '';
      document.getElementById('mWhy').value = found.why || '';
      document.getElementById('mHow').value = found.how || '';
      document.getElementById('mBenefit').value = found.benefit || '';
      document.getElementById('mAlt').value = found.alt || '';
      showToast(`已填充“${found.name}”`);
    } else showToast('未找到');
  });
  document.getElementById('jdSearchBtn').addEventListener('click', () => { const name = document.getElementById('searchName').value.trim(); if(name) window.open(`https://search.jd.com/Search?keyword=${encodeURIComponent(name)}`); });
  document.getElementById('taobaoSearchBtn').addEventListener('click', () => { const name = document.getElementById('searchName').value.trim(); if(name) window.open(`https://s.taobao.com/search?q=${encodeURIComponent(name)}`); });
  document.getElementById('clipboardBtn').addEventListener('click', async () => { try { const text = await navigator.clipboard.readText(); document.getElementById('mName').value = text.split(/[\s,]+/)[0] || ''; document.getElementById('mDesc').value = text.slice(0,50); showToast('已识别剪切板'); } catch { showToast('无法读取剪切板'); } });

  // 物品库
  document.getElementById('openLibraryBtn').addEventListener('click', () => { document.getElementById('libraryModal').style.display = 'flex'; renderLibrary(); });
  document.getElementById('libraryClose').addEventListener('click', () => { document.getElementById('libraryModal').style.display = 'none'; });
  document.getElementById('libSearch').addEventListener('input', renderLibrary);
  document.getElementById('libRoleFilter').addEventListener('change', renderLibrary);
  document.getElementById('libraryList').addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' && e.target.dataset.libname) {
      const name = e.target.dataset.libname;
      const item = masterLibrary.find(i => i.name === name);
      if (item && !allItems().some(i => i.name === name)) {
        customItems.push({...item, id: Date.now()});
        saveLocal(); render(); updateAlert(); showToast(`已添加 ${name}`);
      } else showToast('物品已存在');
    }
  });

  function renderLibrary() {
    const search = document.getElementById('libSearch').value.toLowerCase();
    const role = document.getElementById('libRoleFilter').value;
    const usedNames = new Set(allItems().map(i => i.name));
    let items = masterLibrary.filter(i => !usedNames.has(i.name));
    if (role !== 'all') items = items.filter(i => i.role === role);
    if (search) items = items.filter(i => i.name.toLowerCase().includes(search) || (i.desc||'').includes(search));
    document.getElementById('libraryList').innerHTML = items.length ? items.map(i => `
      <div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;">
        <span>${i.emoji} ${i.name} (${i.role}·${i.cat})</span>
        <button class="status-btn" data-libname="${i.name}">添加</button>
      </div>
    `).join('') : '<p style="text-align:center;padding:20px;">物品库中暂无未使用的物品</p>';
  }

  // GitHub 同步函数
  async function uploadToGitHub() {
    if (!ghConfig) return false;
    try {
      const match = ghConfig.url.match(/github\.com\/([^\/]+)\/([^\/]+)/);
      if (!match) throw new Error('Invalid URL');
      const [_, owner, repo] = match;
      // 保持 skip 状态以备后续使用
      const content = btoa(unescape(encodeURIComponent(JSON.stringify({ customItems, itemStates, currentDay }))));
      const existing = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${ghConfig.path}`, {
        headers: { Authorization: `token ${ghConfig.token}` }
      }).then(r => r.json()).catch(() => null);
      const sha = existing ? existing.sha : '';
      await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${ghConfig.path}`, {
        method: 'PUT',
        headers: { Authorization: `token ${ghConfig.token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'update checklist', content, sha })
      });
      return true;
    } catch (e) { console.error(e); return false; }
  }

  async function downloadFromGitHub() {
    if (!ghConfig) return false;
    try {
      const match = ghConfig.url.match(/github\.com\/([^\/]+)\/([^\/]+)/);
      if (!match) throw new Error('Invalid URL');
      const [_, owner, repo] = match;
      const data = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${ghConfig.path}`, {
        headers: { Authorization: `token ${ghConfig.token}` }
      }).then(r => r.json());
      if (data.content) {
        const json = JSON.parse(atob(data.content));
        customItems = json.customItems || [];
        itemStates = json.itemStates || {};
        currentDay = json.currentDay || 0;
        saveLocal();
        return true;
      }
    } catch (e) { console.error(e); }
    return false;
  }

  let autoSyncTimer;
  function scheduleAutoSync() {
    if (!ghConfig || !autoSyncEnabled) return;
    clearTimeout(autoSyncTimer);
    autoSyncTimer = setTimeout(async () => {
      const ok = await uploadToGitHub();
      if (ok) {
        const now = new Date();
        document.getElementById('syncStatus').textContent = `☁️ 已自动同步 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      }
    }, 2000);
  }

  const autoSyncToggle = document.getElementById('autoSyncToggle');
  autoSyncToggle.classList.toggle('active', autoSyncEnabled);
  autoSyncToggle.addEventListener('click', () => {
    autoSyncEnabled = !autoSyncEnabled;
    localStorage.setItem(AUTO_SYNC_KEY, autoSyncEnabled);
    autoSyncToggle.classList.toggle('active', autoSyncEnabled);
    document.getElementById('syncStatus').textContent = autoSyncEnabled ? '☁️ 自动同步已开启' : '🔒 自动同步已关闭';
    if (autoSyncEnabled) scheduleAutoSync();
  });

  // 按钮事件
  document.getElementById('uploadBtn').addEventListener('click', async function() {
    if (!ghConfig) {
      document.getElementById('syncModal').style.display = 'flex';
      document.getElementById('repoUrl').value = 'https://github.com/july-begins/baby-checklist';
      document.getElementById('repoToken').value = ghConfig?.token || '';
      return;
    }
    showToast('正在同步到云端...');
    const ok = await uploadToGitHub();
    showToast(ok ? '已同步' : '同步失败');
  });

  document.getElementById('downloadBtn').addEventListener('click', async function() {
    if (!ghConfig) {
      document.getElementById('syncModal').style.display = 'flex';
      document.getElementById('repoUrl').value = 'https://github.com/july-begins/baby-checklist';
      document.getElementById('repoToken').value = ghConfig?.token || '';
      return;
    }
    showToast('正在从云端同步...');
    const ok = await downloadFromGitHub();
    if (ok) { document.getElementById('dayInput').value = currentDay; render(); updateAlert(); }
    showToast(ok ? '已更新' : '下载失败');
  });

  document.getElementById('syncSaveBtn').addEventListener('click', () => {
    const url = document.getElementById('repoUrl').value.trim();
    const token = document.getElementById('repoToken').value.trim();
    if (!url || !token) return showToast('请完整填写');
    ghConfig = { url, token, path: 'data.json' };
    localStorage.setItem(GIT_CONFIG_KEY, JSON.stringify(ghConfig));
    document.getElementById('syncModal').style.display = 'none';
    showToast('配置已保存');
    document.getElementById('syncStatus').textContent = '☁️ 已配置';
  });
  document.getElementById('testConnBtn').addEventListener('click', async () => {
    const url = document.getElementById('repoUrl').value.trim();
    const token = document.getElementById('repoToken').value.trim();
    if (!url || !token) return showToast('请完整填写');
    const match = url.match(/github\.com\/([^\/]+)\/([^\/]+)/);
    if (!match) return showToast('仓库地址格式不正确');
    showToast('测试中...');
    try {
      const res = await fetch(`https://api.github.com/repos/${match[1]}/${match[2]}/contents/data.json`, {
        headers: { Authorization: `token ${token}` }
      });
      showToast(res.ok ? '连接成功' : '连接失败，请检查令牌权限');
    } catch (e) { showToast('网络错误'); }
  });
  document.getElementById('syncCloseBtn').addEventListener('click', () => { document.getElementById('syncModal').style.display = 'none'; });

  // 导入导出
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ customItems, itemStates, currentDay })], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '待产包备份.json'; a.click();
    showToast('备份文件已下载');
  });
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
  document.getElementById('importFileInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        customItems = data.customItems; itemStates = data.itemStates; currentDay = data.currentDay;
        saveLocal(); document.getElementById('dayInput').value = currentDay; render(); updateAlert();
        showToast('已恢复备份');
      } catch { showToast('无效文件'); }
    };
    reader.readAsText(file);
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // 初始化
  document.getElementById('dayInput').value = currentDay;
  updateStage();
  render();
  updateAlert();
  if (ghConfig) {
    document.getElementById('syncStatus').textContent = autoSyncEnabled ? '☁️ 已配置，修改后自动同步' : '🔒 自动同步已关闭';
  }
})();
</script>
</body>
</html>
